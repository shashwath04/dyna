[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dino-gnc"
version = "0.1.0.dev0"
description = "Student-owned GNC algorithms with simulation and verification infrastructure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "scipy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dino = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["student: acceptance tests for student-owned algorithms"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dino"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
